<div class="login-container">
  <h2>Logowanie</h2>
  
  @if (errorMessage()) {
    <div class="error-message" role="alert">
      {{ errorMessage() }}
    </div>
  }
  
  <div class="form-group">
    <label for="username">Nazwa użytkownika:</label>
    <input
      type="text"
      id="username"
      [(ngModel)]="username"
      class="form-control"
      placeholder="Wprowadź nazwę użytkownika">
  </div>

  <button type="button" [disabled]="!username.trim()" (click)="onSubmit()" class="btn btn-primary">
    Zaloguj
  </button>
</div>
