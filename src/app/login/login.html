<div class="login-container">
  <h2>Logowanie</h2>
  
  @if (errorMessage()) {
    <div class="error-message" role="alert">
      {{ errorMessage() }}
    </div>
  }
  
  <div class="form-group">
    <label for="username">Nazwa użytkownika:</label>
    <input 
      type="text" 
      id="username" 
      [(ngModel)]="username" 
      class="form-control"
      placeholder="Wprowadź nazwę użytkownika">
  </div>
  
  <div class="form-group">
    <label for="password">Hasło:</label>
    <input 
      type="password" 
      id="password" 
      [(ngModel)]="password" 
      class="form-control"
      placeholder="Wprowadź hasło">
  </div>
  
  <button type="button" (click)="onSubmit()" class="btn btn-primary">Zaloguj</button>
</div>
